name: Deploy React App to DockerHub and Update Helm Values
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Read and increment version
        id: versioning
        run: |
            if [ ! -f version.txt ]; then echo "1" > version.txt; fi
            version=$(cat version.txt)
            new_version=$((version + 1))
            echo $new_version > version.txt
            echo "version=$new_version" >> $GITHUB_ENV

      - name: Commit updated versionn
        run: |
            git add version.txt
            git commit -m "Increment version to 2"
            git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/bikrantsahoo/GitOps.git
            git push origin HEAD:main
        env:
            GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/gitops:${{ env.version }}
            ${{ secrets.DOCKER_USERNAME }}/gitops01:latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
              python-version: '3.x'    
      - name: Install PyYAML
        run: pip install pyyaml

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Update Helm values for Staging
        run: |
          sed -i "s|tag: .*|tag: ${{ env.version }}|g" helm/react-app/values-staging.yaml
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add helm/react-app/values-staging.yaml
          git commit -m "Update staging Helm values to version ${{ env.version }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  deploy-qa:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Update Helm values for QA
        run: |
          sed -i "s|tag: .*|tag: ${{ env.version }}|g" helm/react-app/values-qa.yaml
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add helm/react-app/values-qa.yaml
          git commit -m "Update QA Helm values to version ${{ env.version }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  deploy-live:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Update Helm values for Live
        run: |
          sed -i "s|tag: .*|tag: ${{ env.version }}|g" helm/react-app/values-live.yaml
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add helm/react-app/values-live.yaml
          git commit -m "Update live Helm values to version ${{ env.version }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}