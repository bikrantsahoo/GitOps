name: Deploy React App to DockerHub and Update Helm Values
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gitops01:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/gitops01:latest

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Update Helm values for Staging
        run: |
          python scripts/update_helm_values.py helm/react-app/values-staging.yaml ${{ secrets.DOCKERHUB_USERNAME }}/gitops01 ${{ github.sha }}
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add helm/react-app/values-staging.yaml
          git commit -m "Update staging Helm values to ${{ github.sha }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-qa:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Update Helm values for QA
        run: |
          python scripts/update_helm_values.py helm/react-app/values-qa.yaml ${{ secrets.DOCKERHUB_USERNAME }}/gitops01 ${{ github.sha }}
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add helm/react-app/values-qa.yaml
          git commit -m "Update QA Helm values to ${{ github.sha }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-live:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Update Helm values for Live
        run: |
          python scripts/update_helm_values.py helm/react-app/values-live.yaml ${{ secrets.DOCKERHUB_USERNAME }}/gitops01 ${{ github.sha }}
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add helm/react-app/values-live.yaml
          git commit -m "Update live Helm values to ${{ github.sha }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}